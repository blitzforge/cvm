name: "Release Workflow"

on:
  push:
    branches:
      - alpha
  pull_request:
    paths:
      - ".cvm/changes/**"
  workflow_dispatch:

jobs:
  check-and-apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has-changes: ${{ steps.cvm.outputs.has-changes }}
      applied: ${{ steps.cvm.outputs.applied }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check and apply version changes
        id: cvm
        uses: blitzforge/cvm-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          pr-title: "chore: apply version bumps"
          pr-labels: "version-bump,automated"

      - name: Summary
        run: |
          echo "### Version Check Results" >> $GITHUB_STEP_SUMMARY
          echo "- Has pending changes: **${{ steps.cvm.outputs.has-changes }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Changes applied: **${{ steps.cvm.outputs.applied }}**" >> $GITHUB_STEP_SUMMARY

  test:
    runs-on: ubuntu-latest
    needs: check-and-apply
    if: needs.check-and-apply.outputs.has-changes == 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Run tests
        run: cargo test --all-features

      - name: Run clippy
        run: cargo clippy --all-features -- -D warnings

      - name: Check formatting
        run: cargo fmt -- --check

  publish:
    runs-on: ubuntu-latest
    needs: [check-and-apply, test]
    if: needs.check-and-apply.outputs.has-changes == 'false'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish crates
        id: publish
        uses: blitzforge/cvm-action@v1
        with:
          command: "publish"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Create Git Tag
        if: steps.publish.outputs.published == 'true'
        run: |
          VERSION="${{ steps.publish.outputs.version }}"
          if [ -n "$VERSION" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "v$VERSION" -m "Release v$VERSION"
            git push origin "v$VERSION"
            echo "Created and pushed tag v$VERSION"
          else
            echo "No version found, skipping tag creation"
          fi

      - name: Create GitHub Release
        if: steps.publish.outputs.published == 'true' && steps.publish.outputs.version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.publish.outputs.version }}"
          gh release create "v$VERSION" \
            --title "Release v$VERSION" \
            --notes "## 🚀 Release v$VERSION

          Published to [crates.io](https://crates.io/crates/cvm_cli/$VERSION)

          ### Installation
          \`\`\`bash
          cargo install cvm_cli
          \`\`\`

          ### What's Changed
          This release includes bug fixes and improvements to the CVM CLI tool."

      - name: Publish Summary
        if: steps.publish.outputs.published == 'true'
        run: |
          echo "### 🚀 Publishing Results" >> $GITHUB_STEP_SUMMARY
          echo "- Published: **${{ steps.publish.outputs.published }}**" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.publish.outputs.version }}" ]; then
            echo "- Version: **v${{ steps.publish.outputs.version }}**" >> $GITHUB_STEP_SUMMARY
            echo "- Tag: **v${{ steps.publish.outputs.version }}**" >> $GITHUB_STEP_SUMMARY
            echo "- Release: **[v${{ steps.publish.outputs.version }}](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.publish.outputs.version }})**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Successfully published to crates.io!" >> $GITHUB_STEP_SUMMARY
