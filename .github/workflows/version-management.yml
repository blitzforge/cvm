name: Version Management

on:
  push:
    branches:
      - alpha
    paths:
      - ".cvm/changes/**"
  workflow_dispatch:

jobs:
  apply-versions:
    name: Apply Version Changes
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply version changes
        id: cvm
        uses: blitzforge/cvm-action@v0.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          pr-title: "chore: apply version bumps"
          pr-labels: "version-bump,automated"

      - name: Summary
        if: always()
        run: |
          echo "## CVM Version Management Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Has pending changes:** ${{ steps.cvm.outputs.has-changes }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Changes applied:** ${{ steps.cvm.outputs.applied }}" >> $GITHUB_STEP_SUMMARY
